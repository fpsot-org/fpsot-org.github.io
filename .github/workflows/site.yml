# SPDX-License-Identifier: Apache-2.0
# Builds fpsot.org from the released specs, and deploys it from main, on demand and
# when a spec release asks for it. Pull requests build only.
name: site
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
  repository_dispatch:
    types: [spec-released]
permissions:
  contents: read
jobs:
  build:
    uses: fpsot-org/GitHub-Actions/.github/workflows/site-build.yml@v0
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    # One deploy at a time. Only deploys share the group, so a pull request run never
    # cancels a deploy that waits for its turn.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  home-list:
    # The home page lists the specs by hand; this fails when it misses one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/test-home-list.sh
  site-ok:
    # One required check for branch protection: it fails unless the whole build and
    # the home-list check passed. A skipped job would otherwise count as a pass.
    if: always()
    needs: [build, home-list]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          [ "${{ needs.build.result }}" = success ] && [ "${{ needs.home-list.result }}" = success ]
  pr-title:
    if: github.event_name == 'pull_request'
    uses: fpsot-org/GitHub-Actions/.github/workflows/pr-title.yml@v0
    permissions:
      pull-requests: read
  signed-commits:
    if: github.event_name == 'pull_request'
    uses: fpsot-org/GitHub-Actions/.github/workflows/signed-commits.yml@v0
    permissions:
      contents: read
      pull-requests: read
