site.url=https://fpsot.org
# About 6,000 pages: allow time for the static generation.
quarkus.roq.generator.timeout=1800
# Pages include their body from content/_src/ (written by sitecollect).
quarkus.asciidoc.base-dir=site
# Colour code blocks at build time with Rouge (bundled in AsciidoctorJ). Class names
# only: the colours are in assets/spec.css, and the pages keep no inline style.
quarkus.asciidoc.attributes.source-highlighter=rouge
quarkus.asciidoc.attributes.rouge-css=class
